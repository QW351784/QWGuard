[package]
name = "toolkit_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "toolkit_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.30 只有 multithread 一个 feature，没有可裁的模块，保持默认
sysinfo = "0.30"
rayon = "1.10"
sha2 = "0.10"

[target.'cfg(not(windows))'.dependencies]
ureq = "2.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

# 性能优先：opt-level 3 而不是体积优先的 z
# fat LTO + codegen-units=1 让 LLVM 跨模块优化
# panic=abort 去掉展开逻辑，strip 砍掉符号表
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
