[package]
name = "toolkit_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "toolkit_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
rayon = "1.10"
sha2 = "0.10"

[target.'cfg(not(windows))'.dependencies]
ureq = "2.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 性能优先：从 opt-level="z"（体积优先）改成 3（速度优先）
# codegen-units=1 让 LLVM 能跨模块做全局优化，配合 fat LTO 榨干性能
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
