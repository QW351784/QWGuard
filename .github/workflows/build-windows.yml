name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（最新 stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter（最新 stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 版本自检
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Build Rust core
        working-directory: native
        run: cargo build --release

      - name: Scaffold Windows runner
        working-directory: app
        run: flutter create --platforms=windows --project-name system_toolbox .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows app
        working-directory: app
        # Impeller 在 Windows 上走 D3D12，静态界面也持续整窗重合成，
        # 实测空窗口就能吃掉 30~50% GPU，动画全关也降不下来。
        # 退回 Skia（OpenGL）后空闲占用能压到个位数。若该 flag 不被当前
        # Flutter 版本支持，自动降级为普通构建，不让整条流水线因此失败。
        run: |
          flutter build windows --release --no-enable-impeller
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "该 Flutter 版本不认识 --no-enable-impeller，退回默认构建"
            flutter build windows --release
          }
        shell: pwsh

      - name: Copy native dll, assets and runtime tools
        shell: pwsh
        run: |
          $rel = 'app\build\windows\x64\runner\Release'
          Copy-Item native\target\release\toolkit_native.dll $rel -Force
          if (Test-Path 'app\assets') { Copy-Item app\assets -Recurse (Join-Path $rel 'assets') -Force }
          # 运行库补全的两个工具必须跟着 exe 走，否则工具页点开找不到文件
          if (Test-Path 'vendor\runtime') {
            Copy-Item 'vendor\runtime' -Destination (Join-Path $rel 'runtime') -Recurse -Force
            Get-ChildItem (Join-Path $rel 'runtime') | Select-Object Name, Length
          } else { Write-Warning 'vendor\runtime 不存在' }
          # 内置 YARA：不依赖用户机器是否装过，直接跟着 exe 走
          if (Test-Path 'vendor\yara') {
            Copy-Item 'vendor\yara' -Destination (Join-Path $rel 'yara') -Recurse -Force
            Get-ChildItem (Join-Path $rel 'yara') | Select-Object Name, Length
          } else { Write-Warning 'vendor/yara 不存在' }
          # 内置扫描引擎：火绒 hrscan / PYAS。放进去之后 tool_path 会优先命中
          # <exe>/huorong、<exe>/pyas，用户不用在机器上另装这两个软件
          foreach ($eng in @('huorong','pyas')) {
            if (Test-Path "vendor\$eng") {
              Copy-Item "vendor\$eng" -Destination (Join-Path $rel $eng) -Recurse -Force
              Write-Host "已内置 $eng :"
              Get-ChildItem (Join-Path $rel $eng) | Select-Object Name, Length | Format-Table -AutoSize
            } else { Write-Warning "vendor/$eng 不存在，$eng 引擎不会内置" }
          }
          # 主程序改名：pubspec 里项目名是 system_toolbox，编出来的 exe 也叫这个，
          # 用户会以为是工具箱/安装器，找不到管家本体。改名成 QWGuard.exe。
          $main = Join-Path $rel 'system_toolbox.exe'
          if (Test-Path $main) { Move-Item $main (Join-Path $rel 'QWGuard.exe') -Force }
          # 安装器 / 卸载器：同一份二进制复制改名，main.dart 按文件名分流进 SetupApp，
          # 所以装包和卸包也是 Rust + Flutter 的原生界面（玻璃、粒子、页面切换都在）
          $qw = Join-Path $rel 'QWGuard.exe'
          if (Test-Path $qw) {
            Copy-Item $qw (Join-Path $rel 'QWGuard-Setup.exe') -Force
            Copy-Item $qw (Join-Path $rel 'QWGuard-Uninstall.exe') -Force
          }
          # 安装入口用中文名，双击直接进主界面（不带 --setup，那是工具箱模式）
          $bat = Join-Path $rel '安装 QW 安全电脑管家.bat'
          "@echo off`r`nstart `"`" `"%~dp0QWGuard.exe`"" | Set-Content -Path $bat -Encoding ASCII
          Get-ChildItem $rel -Filter '*.exe' | Select-Object Name, Length
          Get-ChildItem $rel | Select-Object Name, Length

      # 生成完整性清单：安装时 Rust 会按这份清单逐个比对 SHA-256，
      # 任何一个文件和清单对不上就拒绝安装，避免「解压坏了还装进去」
      - name: 生成 SHA-256 校验清单
        shell: pwsh
        run: |
          # 必须取绝对路径。Substring 是拿 $rel.Length 去切 $_.FullName（绝对路径），
          # 用「相对字符串」的长度去切绝对路径，切点会落在路径中间 ——
          # 之前切出来的是 s/x64/runner/Release/dartjni.dll（那个 s 是 windows 的末字母），
          # 安装器按这份清单逐个找文件，找不到就报「缺少文件」。
          $rel = (Resolve-Path 'app\build\windows\x64\runner\Release').Path
          $items = Get-ChildItem $rel -Recurse -File |
            Where-Object { $_.Name -ne 'manifest.json' } |
            ForEach-Object {
              [pscustomobject]@{
                path   = $_.FullName.Substring($rel.Length + 1).Replace('\','/')
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                size   = $_.Length
              }
            }
          @{ version = '1.0'; files = $items } |
            ConvertTo-Json -Depth 4 |
            Set-Content (Join-Path $rel 'manifest.json') -Encoding utf8
          Write-Host "清单条目数：$($items.Count)"
          Get-Content (Join-Path $rel 'manifest.json') -TotalCount 8

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { & $iscc installer\setup.iss } else { Write-Warning 'ISCC 不在预期路径' }

      # 只发安装版：不再产 portable（解压即用）包。
      # 原因：工具箱里的运行库工具、yara 规则等会被单独提取出去，
      # 脱离安装目录就是缺依赖的残包，用户拿到手只会报「缺少必要文件」。
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QWGuard-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: warn
