name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（最新 stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter（最新 stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 版本自检
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Build Rust core
        working-directory: native
        run: cargo build --release

      - name: Scaffold Windows runner
        working-directory: app
        run: flutter create --platforms=windows --project-name system_toolbox .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release

      - name: Copy native dll, assets and runtime tools
        shell: pwsh
        run: |
          $rel = 'app\build\windows\x64\runner\Release'
          Copy-Item native\target\release\toolkit_native.dll $rel -Force
          if (Test-Path 'app\assets') { Copy-Item app\assets -Recurse (Join-Path $rel 'assets') -Force }
          # 运行库补全的两个工具必须跟着 exe 走，否则工具页点开找不到文件
          if (Test-Path 'vendor\runtime') {
            Copy-Item 'vendor\runtime' -Destination (Join-Path $rel 'runtime') -Recurse -Force
            Get-ChildItem (Join-Path $rel 'runtime') | Select-Object Name, Length
          } else { Write-Warning 'vendor\runtime 不存在' }
          # 内置 YARA：不依赖用户机器是否装过，直接跟着 exe 走
          if (Test-Path 'vendor\yara') {
            Copy-Item 'vendor\yara' -Destination (Join-Path $rel 'yara') -Recurse -Force
            Get-ChildItem (Join-Path $rel 'yara') | Select-Object Name, Length
          } else { Write-Warning 'vendor/yara 不存在' }
          # 自绘安装器入口：双击这个 bat 就走 system_toolbox.exe --setup
          $bat = Join-Path $rel 'install.bat'
          "@echo off`r`nstart `"`" `"%~dp0system_toolbox.exe`" --setup" | Set-Content -Path $bat -Encoding ASCII
          Get-ChildItem $rel | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { & $iscc installer\setup.iss } else { Write-Warning 'ISCC 不在预期路径' }

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = 'app\build\windows\x64\runner\Release'
          Compress-Archive -Path "$rel\*" -DestinationPath 'dist\QWGuard-portable.zip' -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QWGuard-windows-x64
          path: |
            app/build/windows/x64/runner/Release/**
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn
