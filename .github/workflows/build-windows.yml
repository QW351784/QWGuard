name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（最新 stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          cache-on-failure: true

      - name: Flutter（最新 stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 版本自检
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Build Rust core
        working-directory: native
        run: cargo build --release

      - name: Scaffold Windows runner
        working-directory: app
        run: flutter create --platforms=windows --project-name system_toolbox .

      # Flutter 3.47+ 在 Windows 上默认改用 Impeller(D3D12)：静态界面也会持续
      # 整窗重合成，实测空窗口就能吃 30~50% GPU。命令行已不提供
      # --no-enable-impeller，必须在生成的 runner 里显式关掉。
      - name: Patch Windows runner (关闭 Impeller)
        working-directory: app
        shell: pwsh
        run: |
          $p = 'windows\runner\main.cpp'
          $c = Get-Content $p -Raw
          if ($c -notmatch 'set_impeller_switch') {
            $old = 'flutter::DartProject project(L"data");'
            $new = 'flutter::DartProject project(L"data");' + "`r`n  project.set_impeller_switch(flutter::ImpellerSwitch::Disabled);"
            $c = $c.Replace($old, $new)
            Set-Content -Path $p -Value $c -NoNewline
          }
          Select-String -Path $p -Pattern 'set_impeller_switch'

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows app
        working-directory: app
        # Impeller 已在 runner 里关掉，退回 Skia；空闲 GPU 从 30~50% 压到个位数。
        run: flutter build windows --release
        shell: pwsh

      - name: Copy native dll, assets and runtime tools
        shell: pwsh
        run: |
          $rel = 'app\build\windows\x64\runner\Release'
          Copy-Item native\target\release\toolkit_native.dll $rel -Force
          # Flutter 的工程名是 system_toolbox，产出的 exe 也叫 system_toolbox.exe。
          # 安装器/快捷方式/自启动都按 QWGuard.exe 找，名字不改就“点立即启动直接消失”。
          if (Test-Path "$rel\system_toolbox.exe") {
            Rename-Item "$rel\system_toolbox.exe" 'QWGuard.exe' -Force
          }
          if (Test-Path 'app\assets') { Copy-Item app\assets -Recurse (Join-Path $rel 'assets') -Force }
          # 运行库补全的两个工具必须跟着 exe 走，否则工具页点开找不到文件
          if (Test-Path 'vendor\runtime') {
            Copy-Item 'vendor\runtime' -Destination (Join-Path $rel 'runtime') -Recurse -Force
            # 233MB 的 DirectX Repair 离线数据包不进安装包：
            # 它只用于离线补 d3dx，微软官方 dxwebsetup.exe（288KB）可在线补同一批组件。
            # 功能保留，安装包体积直接砍掉约 70%。
            if (Test-Path "$rel\runtime\Data") {
              Remove-Item "$rel\runtime\Data" -Recurse -Force
            }
            Get-ChildItem "$rel\runtime" -Filter '*.exe' |
              Where-Object { $_.Name -match 'DirectX.*Repair' } |
              Remove-Item -Force
            Get-ChildItem (Join-Path $rel 'runtime') | Select-Object Name, Length
          } else { Write-Warning 'vendor\runtime 不存在' }
      # 生成完整性清单：安装时 Rust 会按这份清单逐个比对 SHA-256，
      # 任何一个文件和清单对不上就拒绝安装，避免「解压坏了还装进去」
      - name: 生成 SHA-256 校验清单
        shell: pwsh
        run: |
          # 必须取绝对路径。Substring 是拿 $rel.Length 去切 $_.FullName（绝对路径），
          # 用「相对字符串」的长度去切绝对路径，切点会落在路径中间 ——
          # 之前切出来的是 s/x64/runner/Release/dartjni.dll（那个 s 是 windows 的末字母），
          # 安装器按这份清单逐个找文件，找不到就报「缺少文件」。
          $rel = (Resolve-Path 'app\build\windows\x64\runner\Release').Path
          $items = Get-ChildItem $rel -Recurse -File |
            Where-Object { $_.Name -ne 'manifest.json' } |
            ForEach-Object {
              [pscustomobject]@{
                path   = $_.FullName.Substring($rel.Length + 1).Replace('\','/')
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
                size   = $_.Length
              }
            }
          @{ version = '1.0'; files = $items } |
            ConvertTo-Json -Depth 4 |
            Set-Content (Join-Path $rel 'manifest.json') -Encoding utf8
          Write-Host "清单条目数：$($items.Count)"
          Get-Content (Join-Path $rel 'manifest.json') -TotalCount 8

      # 单文件安装器：Rust SFX 外壳 + Flutter 安装界面，不再套 Inno Setup。
      # payload.zip = 整个 Release 目录；追加到 qw_setup.exe 末尾，尾部写 24 字节 trailer。
      - name: Build single-file installer (Rust SFX)
        shell: pwsh
        run: |
          $rel = 'app\build\windows\x64\runner\Release'
          if (Test-Path 'payload.zip') { Remove-Item 'payload.zip' -Force }
          Compress-Archive -Path "$rel\*" -DestinationPath 'payload.zip' -CompressionLevel Optimal
          $out = 'QWGuard-Setup-1.0.exe'
          Copy-Item 'native\target\release\qw_setup.exe' $out -Force
          $payload = [IO.File]::ReadAllBytes('payload.zip')
          $fs = [IO.File]::Open($out, 'Append', 'Write')
          $off = [uint64]$fs.Length
          $fs.Write($payload, 0, $payload.Length)
          $tr = New-Object byte[] 24
          [BitConverter]::GetBytes([uint64]$off).CopyTo($tr, 0)
          [BitConverter]::GetBytes([uint64]$payload.Length).CopyTo($tr, 8)
          [Text.Encoding]::ASCII.GetBytes('QWPAY1!!').CopyTo($tr, 16)
          $fs.Write($tr, 0, 24)
          $fs.Close()
          Get-Item $out | Select-Object Name, Length

      # 只发安装版：不再产 portable（解压即用）包。
      # 原因：工具箱里的运行库工具、yara 规则等会被单独提取出去，
      # 脱离安装目录就是缺依赖的残包，用户拿到手只会报「缺少必要文件」。
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QWGuard-windows-x64
          path: |
            QWGuard-Setup-1.0.exe
          if-no-files-found: warn
