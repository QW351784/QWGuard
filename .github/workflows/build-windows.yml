name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain（最新 stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter（最新 stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 版本自检
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Build Rust core
        working-directory: native
        run: cargo build --release

      - name: Scaffold Windows runner
        working-directory: app
        run: flutter create --platforms=windows --project-name system_toolbox .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release

      - name: Copy native dll and assets
        shell: pwsh
        run: |
          $rel = 'app\build\windows\x64\runner\Release'
          Copy-Item native\target\release\toolkit_native.dll $rel -Force
          if (Test-Path 'app\assets') { Copy-Item app\assets -Recurse (Join-Path $rel 'assets') -Force }
          Get-ChildItem $rel | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { & $iscc installer\setup.iss } else { Write-Warning 'ISCC 不在预期路径' }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: QWGuard-windows-x64
          path: |
            app/build/windows/x64/runner/Release/**
            dist/*.exe
          if-no-files-found: warn
