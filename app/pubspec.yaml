name: system_toolbox
description: Windows 系统工具箱 —— Flutter + Impeller + Rust FFI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  shared_preferences: ^2.3.2
  flutter_acrylic: ^1.1.4
  window_manager: ^0.4.3
  desktop_multi_window: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
